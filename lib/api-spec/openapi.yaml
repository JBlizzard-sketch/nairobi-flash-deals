openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Nairobi Flash Deals API — premium same-day deal platform for upscale venues
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Phone OTP authentication
  - name: venues
    description: Venue management
  - name: deals
    description: Flash deal lifecycle
  - name: bookings
    description: Booking and payment flow
  - name: users
    description: Customer accounts and preferences
  - name: ratings
    description: Post-visit ratings and reviews

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ─────────────────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register with phone number
      description: Creates account and sends OTP. In development the OTP is returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSentResponse"
        "409":
          description: Phone already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with phone number
      description: Sends OTP to registered phone. In development the OTP is returned in the response.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /auth/verify:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and receive JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpRequest"
      responses:
        "200":
          description: Authenticated — returns JWT token and user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Incorrect or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Authenticated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateAuthMe
      tags: [auth]
      summary: Update current user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout (client should discard token)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required: [message]

  # ── Venues ───────────────────────────────────────────────────
  /venues:
    get:
      operationId: listVenues
      tags: [venues]
      summary: List approved venues
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/VenueCategory"
        - in: query
          name: neighborhood
          schema:
            $ref: "#/components/schemas/VenueNeighborhood"
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: offset
          schema:
            type: number
      responses:
        "200":
          description: List of venues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueListResponse"
    post:
      operationId: createVenue
      tags: [venues]
      summary: Submit a venue for approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVenueRequest"
      responses:
        "201":
          description: Venue created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "400":
          $ref: "#/components/responses/BadRequest"

  /venues/{id}:
    get:
      operationId: getVenue
      tags: [venues]
      summary: Get a single venue
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Venue detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateVenue
      tags: [venues]
      summary: Update venue details
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVenueRequest"
      responses:
        "200":
          description: Updated venue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"
        "404":
          $ref: "#/components/responses/NotFound"

  /venues/{id}/approve:
    post:
      operationId: approveVenue
      tags: [venues]
      summary: Admin — approve a venue
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Venue approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Venue"

  /venues/{id}/analytics:
    get:
      operationId: getVenueAnalytics
      tags: [venues]
      summary: Venue performance analytics
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VenueAnalytics"

  # ── Deals ────────────────────────────────────────────────────
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List live deals (trending feed)
      parameters:
        - in: query
          name: category
          schema:
            $ref: "#/components/schemas/DealCategory"
        - in: query
          name: neighborhood
          schema:
            $ref: "#/components/schemas/VenueNeighborhood"
        - in: query
          name: venueId
          schema:
            type: number
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/DealStatus"
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: minPrice
          schema:
            type: number
        - in: query
          name: maxPrice
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: offset
          schema:
            type: number
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealListResponse"
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a flash deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDealRequest"
      responses:
        "201":
          description: Deal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          $ref: "#/components/responses/BadRequest"

  /deals/trending:
    get:
      operationId: getTrendingDeals
      tags: [deals]
      summary: Filling fast today — real-time trending
      responses:
        "200":
          description: Trending deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealListResponse"

  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get a single deal with live slot count
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateDeal
      tags: [deals]
      summary: Update a deal (venue manager)
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDealRequest"
      responses:
        "200":
          description: Updated deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /deals/{id}/publish:
    post:
      operationId: publishDeal
      tags: [deals]
      summary: Go live — publish a draft deal
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deal is now live
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /deals/{id}/cancel:
    post:
      operationId: cancelDeal
      tags: [deals]
      summary: Cancel a live deal
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Deal cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  # ── Bookings ─────────────────────────────────────────────────
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for current user
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/BookingStatus"
        - in: query
          name: limit
          schema:
            type: number
        - in: query
          name: offset
          schema:
            type: number
      responses:
        "200":
          description: Booking list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListResponse"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Reserve slots on a deal (initiates Mpesa payment)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created — awaiting payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: No slots available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get booking details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Booking detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          $ref: "#/components/responses/NotFound"

  /bookings/{id}/cancel:
    post:
      operationId: cancelBooking
      tags: [bookings]
      summary: Cancel a booking
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/checkin:
    post:
      operationId: checkInBooking
      tags: [bookings]
      summary: Venue staff check-in confirmation
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  # ── Users ────────────────────────────────────────────────────
  /users/me:
    get:
      operationId: getMe
      tags: [users]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateMe
      tags: [users]
      summary: Update profile and notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # ── Payments ─────────────────────────────────────────────────
  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payments]
      summary: Initiate Mpesa STK Push for a booking
      description: |
        Sends an M-Pesa STK Push prompt to the customer's phone.
        In dev/sandbox mode without Mpesa credentials configured,
        automatically confirms the booking (simulated payment).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InitiatePaymentRequest"
      responses:
        "200":
          description: STK Push sent or simulated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InitiatePaymentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Booking is not in pending_payment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /payments/callback:
    post:
      operationId: mpesaCallback
      tags: [payments]
      summary: Daraja payment callback (called by Safaricom)
      description: Receives STK Push result from Safaricom servers. Not for direct client use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Callback acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ResultCode:
                    type: number
                  ResultDesc:
                    type: string
                required: [ResultCode, ResultDesc]

  /payments/query:
    post:
      operationId: queryPaymentStatus
      tags: [payments]
      summary: Query STK Push payment status
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bookingId:
                  type: number
              required: [bookingId]
      responses:
        "200":
          description: Payment status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentQueryResponse"

  # ── Notifications ────────────────────────────────────────────
  /notifications/preferences:
    patch:
      operationId: updateNotificationPreferences
      tags: [notifications]
      summary: Update deal category subscriptions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPreferencesRequest"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferencesResponse"

  /notifications/location:
    put:
      operationId: updateUserLocation
      tags: [notifications]
      summary: Update user lat/lng for geo-filtered notifications
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationRequest"
      responses:
        "200":
          description: Location updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationResponse"

  /notifications/push-token:
    put:
      operationId: registerPushToken
      tags: [notifications]
      summary: Register or update FCM push token
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pushToken:
                  type: string
              required: [pushToken]
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]

  /notifications/log:
    get:
      operationId: getNotificationLog
      tags: [notifications]
      summary: List recent push notifications sent to the authenticated user
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema: { type: number }
      responses:
        "200":
          description: Notification history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationLogResponse"

  /notifications/test:
    post:
      operationId: sendTestNotification
      tags: [notifications]
      summary: Send a test push notification to yourself
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Test push result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestNotificationResponse"

  # ── WhatsApp Bot ─────────────────────────────────────────────
  /whatsapp/webhook:
    get:
      operationId: verifyWhatsAppWebhook
      tags: [whatsapp]
      summary: Meta webhook verification challenge
      description: Called by Meta during webhook registration to verify ownership.
      parameters:
        - in: query
          name: hub.mode
          schema: { type: string }
        - in: query
          name: hub.verify_token
          schema: { type: string }
        - in: query
          name: hub.challenge
          schema: { type: string }
      responses:
        "200":
          description: Challenge echoed back to Meta
        "403":
          $ref: "#/components/responses/BadRequest"
    post:
      operationId: whatsAppWebhook
      tags: [whatsapp]
      summary: Receive inbound WhatsApp messages from venues
      description: |
        Called by Meta Cloud API when a venue sends a WhatsApp message.
        The bot parses the deal, asks for confirmation, then posts it live.
        Always responds 200 immediately (Meta requires < 20s ack).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppWebhookPayload"
      responses:
        "200":
          description: Acknowledged

  /whatsapp/test:
    post:
      operationId: testWhatsAppBot
      tags: [whatsapp]
      summary: Dev/sandbox — simulate sending a deal message to the bot
      description: |
        Lets you test the deal parser without a real WhatsApp account.
        Add `?parseOnly=1` to skip the DB lookup and only return parse results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WhatsAppTestRequest"
      responses:
        "200":
          description: Bot response and parse result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WhatsAppTestResponse"

  # ── Ratings ──────────────────────────────────────────────────
  /ratings:
    post:
      operationId: createRating
      tags: [ratings]
      summary: Submit a post-visit rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRatingRequest"
      responses:
        "201":
          description: Rating submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "400":
          $ref: "#/components/responses/BadRequest"

  /ratings/booking/{bookingId}:
    get:
      operationId: getBookingRating
      tags: [ratings]
      summary: Get rating for a specific booking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: bookingId
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Rating for the booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "404":
          $ref: "#/components/responses/NotFound"

  /ratings/deal/{dealId}:
    get:
      operationId: listDealRatings
      tags: [ratings]
      summary: List ratings for a deal
      parameters:
        - in: path
          name: dealId
          required: true
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
      responses:
        "200":
          description: Deal ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingListResponse"

  /ratings/venue/{venueId}:
    get:
      operationId: listVenueRatings
      tags: [ratings]
      summary: List ratings for a venue
      parameters:
        - in: path
          name: venueId
          required: true
          schema:
            type: number
        - in: query
          name: limit
          schema:
            type: number
      responses:
        "200":
          description: Venue ratings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RatingListResponse"

  /ratings/{id}/respond:
    patch:
      operationId: respondToRating
      tags: [ratings]
      summary: Venue manager responds to a rating
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                response:
                  type: string
              required: [response]
      responses:
        "200":
          description: Rating with response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rating"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      in: path
      name: id
      required: true
      schema:
        type: number

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid auth token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
      required: [message]

    NotificationPreferencesRequest:
      type: object
      properties:
        subscriptionCategories:
          type: array
          items:
            type: string
            enum: [restaurant, spa, bar, fitness, experience]
          minItems: 1
        neighborhoodPref:
          type: string

    NotificationPreferencesResponse:
      type: object
      properties:
        message: { type: string }
        preferences:
          type: object
          properties:
            id: { type: number }
            subscriptionCategories:
              type: array
              items: { type: string }
            neighborhoodPref: { type: string }
          required: [id, subscriptionCategories]
      required: [message, preferences]

    LocationRequest:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required: [latitude, longitude]

    LocationResponse:
      type: object
      properties:
        message: { type: string }
        latitude: { type: number }
        longitude: { type: number }
      required: [message, latitude, longitude]

    NotificationLogItem:
      type: object
      properties:
        id: { type: number }
        userId: { type: number }
        dealId: { type: number }
        channel: { type: string }
        status: { type: string }
        title: { type: string }
        body: { type: string }
        fcmMessageId: { type: string }
        distanceKm: { type: string }
        sentAt: { type: string, format: date-time }
      required: [id, userId, dealId, channel, status, title, body, sentAt]

    NotificationLogResponse:
      type: object
      properties:
        data:
          type: array
          items:
